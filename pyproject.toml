[tool.poetry]
name = "hover-dns-updater"
version = "0.1.0"
description = "Update DNS entry on hover.com"
authors = ["Mark Silva <github3@markesilva.com>"]
license = "GPL"
readme = "README.md"
packages = [{ include = "hover_dns_updater", from = "src" }]

[tool.poetry.scripts]
hover-dns-updater = "hover_dns_updater.main:main"

[tool.poetry.dependencies]
python = "^3.15"
requests = "^2.31.0"
pyopenssl = "^26.4.0"
pyotp = "^2.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.1"
pep8-naming = "^0.13.3"
black = "^26.10.1"
sphinx = "^7.0.1"
flake8 = "^7.5.0"

[tool.pytest.ini_options]
addopts = "--cov=src/hover_dns_updater --cov-report=term-missing --cov-report=xml -v"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: fast isolated unit tests",
    "integration: multi-module integration tests",
]

[tool.coverage.paths]
# The installer test executes a temporary installed copy of this package.
source = ["src/hover_dns_updater", "*/etc/hover-dns-updater/src/hover_dns_updater"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
