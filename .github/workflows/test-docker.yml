name: Test docker file

on: [push, pull_request]

env:
  TEST_TAG: texasaggie97/texasaggie97/hover-dns-updater:test
  LATEST_TAG: texasaggie97/texasaggie97/hover-dns-updater:latest
  PRODUCTION_TEST_TAG: hover-dns-updater:production-ci

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and test the test image
        uses: docker/build-push-action@v4
        with:
          context: .
          load: true
          tags: ${{ env.TEST_TAG }}
          target: test

      - name: Build the production image
        uses: docker/build-push-action@v4
        with:
          context: .
          load: true
          tags: ${{ env.PRODUCTION_TEST_TAG }}
          target: production

      - name: Smoke test the production image
        run: |
          docker image inspect --format '{{json .Config.Cmd}}' "$PRODUCTION_TEST_TAG" |
            grep -Fx '["python","hover-dns-updater.py","--service"]'

          docker run --rm --network none "$PRODUCTION_TEST_TAG" python -c \
            'import os, sys, ssl, OpenSSL, pyotp, requests; assert sys.version_info[:2] == (3, 15); assert os.environ["HOVER_HEALTHCHECK_FILE"] == "/tmp/hover-dns-updater-health"'

          docker run --rm --network none "$PRODUCTION_TEST_TAG" \
            python hover-dns-updater.py --help | grep -F -- '--test'

          options=(
            --rm --network none
            --env USERNAME=ci-user
            --env PASSWORD=ci-password
            --env TOPTKEY=JBSWY3DPEBLW64TMMQ======
            --env DNS1=ci-dns
            --env LOGFILE=/tmp/ci.log
          )
          script_output="$(docker run "${options[@]}" "$PRODUCTION_TEST_TAG" \
            python hover-dns-updater.py --service --poll-time 123 --test)"
          command_output="$(docker run "${options[@]}" "$PRODUCTION_TEST_TAG" \
            hover-dns-updater --service --poll-time 123 --test)"
          test "$script_output" = "$command_output"
          grep -Fx '    USERNAME = ci-user' <<< "$script_output"
          grep -Fx "    DNS_IDS = ['ci-dns']" <<< "$script_output"
          grep -Fx '    SERVICE = True' <<< "$script_output"
          grep -Fx '    POLLTIME = 123' <<< "$script_output"

